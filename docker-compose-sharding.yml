version: '3.8'

services:
  # Config Server Replica Set
  configsvr:
    image: mongo:latest
    container_name: mongo-configsvr
    command: mongod --configsvr --replSet configReplSet --port 27019 --bind_ip_all
    ports:
      - "27019:27019"

  # Shard 1
  shard1:
    image: mongo:latest
    container_name: mongo-shard1
    command: mongod --shardsvr --port 27018 --bind_ip_all
    ports:
      - "27018:27018"

  # Shard 2
  shard2:
    image: mongo:latest
    container_name: mongo-shard2
    command: mongod --shardsvr --port 27020 --bind_ip_all
    ports:
      - "27020:27020"

  # Query Router (mongos)
  mongos:
    image: mongo:latest
    container_name: mongo-router
    command: mongos --configdb configReplSet/configsvr:27019 --port 27017 --bind_ip_all
    ports:
      - "27017:27017"
    depends_on:
      - configsvr
      - shard1
      - shard2
